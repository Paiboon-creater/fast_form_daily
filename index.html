<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JAGUAR_PRODUCTION_SUPABASE // DAILY PROD TERMINAL</title>
  <!-- โหลดไลบรารีสำหรับสร้าง QR Code และสแกน QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- FontAwesome สำหรับไอคอน -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #030806;
      --panel-bg: rgba(7, 24, 16, 0.95);
      --border-neon: #00ff88;
      --border-dim: #113a24;
      --text-main: #e2f0ea;
      --text-muted: #8ca89a;
      --neon-green: #00ff88;
      --neon-red: #ff3366;
      --neon-yellow: #f5a623;
      --neon-blue: #00e5ff;
      --neon-glow: rgba(0, 255, 136, 0.4);
      --input-bg: #0b2218;
      --highlight: rgba(0, 255, 136, 0.2);
    }

    body {
      font-family: 'Sarabun', Tahoma, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      /* Transition สำหรับตอนเพิ่มพื้นที่หลบแป้นพิมพ์ */
      transition: padding-bottom 0.3s ease; 
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(3, 8, 6, 0.95), rgba(5, 20, 12, 0.9)),
                  url('https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=1200&q=80') no-repeat center center;
      background-size: cover;
      z-index: -1;
      filter: brightness(0.35) contrast(1.2) hue-rotate(60deg);
    }

    .terminal-container {
      width: 100%;
      max-width: 500px;
      background: var(--panel-bg);
      padding: 15px;
      border-radius: 12px;
      border: 2px solid var(--border-neon);
      box-shadow: 0 0 25px var(--neon-glow), inset 0 0 15px rgba(0, 255, 136, 0.1);
      backdrop-filter: blur(10px);
      margin-top: 5px;
      margin-bottom: 20px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-bottom: 1px dashed var(--border-neon);
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .jaguar-emblem {
      width: 45px;
      height: 45px;
      background: radial-gradient(circle, #113a24 0%, #030806 100%);
      border: 2px solid var(--neon-green);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 10px var(--neon-glow);
    }

    .jaguar-emblem i {
      font-size: 20px;
      color: var(--neon-green);
    }

    .app-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--neon-green);
      margin: 0;
      text-transform: uppercase;
      text-shadow: 0 0 5px var(--neon-glow);
    }

    .status { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 15px;}
    .status-dot {
      display: inline-block; width: 8px; height: 8px;
      background-color: var(--neon-green); border-radius: 50%;
      margin-right: 4px; box-shadow: 0 0 6px var(--neon-green);
    }

    /* ปุ่มกลับหน้าหลัก */
    .back-link-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: transparent;
      color: var(--neon-blue);
      border: 2px solid var(--neon-blue);
      padding: 14px;
      font-size: 16px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      box-sizing: border-box;
      transition: all 0.3s;
      margin-bottom: 20px;
      font-family: inherit;
    }
    .back-link-btn:active, .back-link-btn:hover {
      background: var(--neon-blue);
      color: var(--bg-dark);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
    }

    .form-group { margin-bottom: 14px; }
    .form-group label { 
      display: block; 
      margin-bottom: 6px; 
      font-size: 16px; 
      font-weight: bold; 
      color: #ffffff;
    }

    input, select {
      width: 100%; 
      padding: 14px; 
      background-color: #0b2218; 
      border: 2px solid var(--border-dim); 
      color: #00ffaa; 
      font-weight: bold;
      border-radius: 8px; 
      box-sizing: border-box; 
      font-family: inherit;
      font-size: 18px; 
      transition: all 0.2s;
    }

    input::placeholder {
      color: rgba(140, 168, 154, 0.6);
      font-size: 16px;
    }

    input:focus, select:focus { 
      border-color: var(--neon-green); 
      outline: none; 
      box-shadow: 0 0 10px var(--neon-glow); 
      background-color: #0e2b1f;
    }

    input[readonly] { 
      background-color: #071710; 
      cursor: pointer; 
      color: #00ffaa; 
      border-style: dashed;
    }
    
    input[type="date"] {
      text-align: center;
    }

    input[type="date"]::-webkit-calendar-picker-indicator { 
      filter: invert(0.8) sepia(1) saturate(5) hue-rotate(90deg); 
      cursor: pointer; 
      width: 25px;
      height: 25px;
    }

    .scan-btn-subtle {
      background: rgba(0, 229, 255, 0.1);
      border: 2px solid rgba(0, 229, 255, 0.3);
      color: var(--neon-blue);
      border-radius: 8px;
      width: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 22px;
      transition: all 0.2s;
    }
    .scan-btn-subtle:active {
      background: var(--neon-blue);
      color: var(--bg-dark);
    }

    .scanner-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 8, 6, 0.95); z-index: 2000;
      justify-content: center; align-items: center; flex-direction: column; padding: 20px; box-sizing: border-box;
    }
    .scanner-box {
      width: 100%; max-width: 400px; background: var(--panel-bg);
      border: 2px solid var(--neon-blue); border-radius: 12px; padding: 15px; text-align: center;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.3);
    }
    .scanner-close {
      background: transparent; border: 1px solid var(--neon-red); color: var(--neon-red);
      padding: 12px; width: 100%; margin-top: 15px; border-radius: 8px; cursor: pointer;
      font-family: inherit; font-weight: bold; font-size: 16px;
    }

    .eff-box {
      background: #071710;
      border: 2px solid var(--border-dim);
      padding: 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: bold;
    }
    .eff-value { font-size: 22px; }

    .submit-btn {
      width: 100%; background: linear-gradient(145deg, #071910, #040e09); color: var(--neon-green);
      border: 2px solid var(--neon-green); padding: 18px; font-size: 20px;
      border-radius: 10px; cursor: pointer; font-weight: bold;
      margin-top: 10px;
      font-family: inherit; transition: all 0.3s; letter-spacing: 1px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .submit-btn:active { background: var(--neon-green); color: var(--bg-dark); transform: translateY(2px); }

    .cancel-edit-btn {
      width: 100%; background-color: transparent; color: var(--neon-red);
      border: 1px solid var(--neon-red); padding: 12px; font-size: 16px;
      border-radius: 8px; cursor: pointer; margin-top: 12px; display: none;
      font-family: inherit; font-weight: bold;
    }

    .keypad-modal {
      display: none; position: fixed; bottom: 0; left: 0; width: 100%;
      background: rgba(4, 15, 10, 0.98); border-top: 2px solid var(--neon-green);
      padding: 15px; box-sizing: border-box; box-shadow: 0 -10px 30px rgba(0,0,0,0.9); z-index: 1000;
    }
    .keypad-header { display: flex; justify-content: space-between; color: var(--neon-green); margin-bottom: 12px; font-size: 16px; font-weight: bold; }
    .keypad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 500px; margin: 0 auto; }
    
    .key-btn {
      background: var(--input-bg); color: #00ffaa; border: 1px solid var(--border-dim);
      padding: 18px 0; font-size: 24px; border-radius: 10px; cursor: pointer;
      font-family: inherit; font-weight: bold;
    }
    .key-btn:active { background: #113a24; }
    .key-action { color: var(--neon-red); border-color: var(--neon-red); font-size: 18px; }
    .key-special { color: var(--neon-green); border-color: var(--border-dim); background: #0c1a12; }
    .key-close { background: var(--border-dim); grid-column: span 4; margin-top: 5px; font-size: 18px; color: var(--neon-green); font-weight: bold; border-color: var(--neon-green); }
    
    .key-equals {
      background-color: var(--neon-green);
      color: var(--bg-dark);
      font-size: 28px;
      border: none;
      box-shadow: 0 0 10px rgba(0,255,136,0.3);
    }
    .key-equals:active { background-color: #00cc6a; }

    .system-msg { text-align: center; font-size: 14px; margin-bottom: 12px; }
    .loading { color: var(--neon-yellow); }
    .error { color: var(--neon-red); }

    /* ซ่อนรายงานแบบ 100% ไม่ให้รบกวนหน้าจอ */
    #reportSection { display: none !important; }
    #printArea { display: none; }
  </style>
</head>
<body>

<div class="terminal-container">
  <div class="app-header">
    <div class="jaguar-emblem">
      <i class="fa-solid fa-cat"></i>
    </div>
    <div>
      <h1 class="app-title">บันทึกยอดผลิตรายวัน</h1>
    </div>
  </div>

  <div class="status">
    <span class="status-dot" id="statusDot"></span><span id="statusText">กำลังเชื่อมต่อฐานข้อมูล...</span>
  </div>

  <div id="statusMessage" class="system-msg loading">> กำลังเตรียมข้อมูลระบบ...</div>
  
  <form id="prodForm" onsubmit="handleSubmit(event)" style="display:none;">
    
    <!-- ปุ่มกลับหน้าตารางหลัก (เพิ่มใหม่) -->
    <a href="https://paiboon-creater.github.io/daily-production/" class="back-link-btn">
      <i class="fa-solid fa-house"></i> กลับหน้าตารางหลัก (Daily Production)
    </a>

    <!-- 1. วันที่ทำงาน -->
    <div class="form-group">
      <label>1. วันที่ทำงาน</label>
      <input type="date" id="record_date" required>
    </div>

    <!-- 2. รหัสใบสั่งงาน -->
    <div class="form-group">
      <label>2. รหัสใบสั่งงาน</label>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="text" id="manual_order_code" style="flex: 1; text-align: center; color: var(--neon-yellow);" placeholder="👉 แตะคีย์รหัส 4 หลัก" readonly onclick="openKeypad('manual_order_code')">
        <button type="button" class="scan-btn-subtle" onclick="openScanner()">
          <i class="fa-solid fa-qrcode"></i>
        </button>
      </div>
      <select id="id_order" onchange="handleOrderChange()" required>
        <option value="">👉 หรือแตะเลือกจากรายการ</option>
      </select>
    </div>

    <!-- 3. ขั้นตอน -->
    <div class="form-group">
      <label>3. ชิ้นงาน / ขั้นตอน</label>
      <select id="id_target" onchange="calculateEfficiency()" required>
        <option value="">👉 รอเลือกรหัสใบสั่งงานก่อน</option>
      </select>
      <input type="hidden" id="id_work" value="">
    </div>

    <!-- 4. พนักงาน -->
    <div class="form-group">
      <label>4. ชื่อพนักงาน</label>
      <input type="text" id="employee_search" list="employee_datalist" placeholder="⌨️ พิมพ์ชื่อค้นหา..." autocomplete="off" onfocus="this.select()" onclick="this.select()" required>
      <datalist id="employee_datalist"></datalist>
    </div>

    <!-- 5. ชั่วโมงทำงาน -->
    <div class="form-group">
      <label>5. ชั่วโมงทำงาน</label>
      <input type="text" id="hour_work" readonly placeholder="⌨️ แตะพิมพ์ตัวเลข" onclick="openKeypad('hour_work')" required>
    </div>

    <!-- 6. ยอดผลิต -->
    <div class="form-group">
      <label>6. จำนวนที่ผลิตได้</label>
      <input type="text" id="produced_amount" readonly placeholder="⌨️ แตะพิมพ์ตัวเลข" onclick="openKeypad('produced_amount')" required>
    </div>

    <!-- ประสิทธิภาพ (อัตโนมัติ) -->
    <div class="eff-box">
      <span>> ประสิทธิภาพ:</span>
      <span id="effDisplay" class="eff-value" style="color: var(--text-muted);">0.00%</span>
    </div>

    <!-- 7. สาเหตุ -->
    <div class="form-group" id="reasonGroup" style="display: none;">
      <label style="color: var(--neon-red);">7. สาเหตุที่ยอดตก (บังคับเลือก)</label>
      <select id="id_reason">
        <option value="">👉 แตะเลือกสาเหตุ</option>
      </select>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">บันทึกข้อมูล</button>
    <button type="button" class="cancel-edit-btn" id="cancelEditBtn" onclick="cancelEditMode()">[X] ยกเลิกการแก้ไข</button>
  </form>

  <!-- ซ่อนส่วน Report ตารางด้านล่างทิ้งทั้งหมด -->
  <div class="report-section" id="reportSection">
    <select id="filter_order" style="display:none;"></select>
    <select id="filter_work" style="display:none;"></select>
    <select id="filter_target" style="display:none;"></select>
    <input type="date" id="filter_date_from" style="display:none;">
    <input type="date" id="filter_date_to" style="display:none;">
    <span id="sumProduced"></span><span id="sumTarget"></span>
    <span id="sumRemaining"></span><span id="sumDaysLeft"></span>
    <tbody id="reportTbody"></tbody>
    <table id="reportTable"></table>
  </div>
</div>

<!-- QR SCANNER MODAL -->
<div id="scannerModal" class="scanner-modal" style="display:none;">
  <div class="scanner-box">
    <h3 style="color:var(--neon-blue); margin-top:0;">สแกนคิวอาร์โค้ด</h3>
    <div id="reader" style="width:100%;"></div>
    <button type="button" class="scanner-close" onclick="closeScanner()">ปิดกล้อง</button>
  </div>
</div>

<div id="printArea"></div>

<!-- แป้นพิมพ์ตัวเลข -->
<div id="numericKeypad" class="keypad-modal">
  <div class="keypad-header">
    <span id="keypadTitle">> ระบุค่า: </span>
    <span onclick="closeKeypad()" style="cursor:pointer; color: var(--neon-red);">[X] ปิด</span>
  </div>
  <div class="keypad-grid">
    <button type="button" class="key-btn" onclick="pressKey('7')">7</button>
    <button type="button" class="key-btn" onclick="pressKey('8')">8</button>
    <button type="button" class="key-btn" onclick="pressKey('9')">9</button>
    <button type="button" class="key-btn key-special key-math" onclick="pressKey('+')">+</button>
    
    <button type="button" class="key-btn" onclick="pressKey('4')">4</button>
    <button type="button" class="key-btn" onclick="pressKey('5')">5</button>
    <button type="button" class="key-btn" onclick="pressKey('6')">6</button>
    <button type="button" class="key-btn key-special key-math" onclick="pressKey('-')">-</button>
    
    <button type="button" class="key-btn" onclick="pressKey('1')">1</button>
    <button type="button" class="key-btn" onclick="pressKey('2')">2</button>
    <button type="button" class="key-btn" onclick="pressKey('3')">3</button>
    <button type="button" class="key-btn key-special key-math" onclick="pressKey('*')">*</button>
    
    <button type="button" class="key-btn" onclick="pressKey('0')">0</button>
    <button type="button" class="key-btn" onclick="pressKey('00')">00</button>
    <button type="button" class="key-btn key-math" onclick="pressKey('.')">.</button>
    <button type="button" class="key-btn key-special key-math" onclick="pressKey('/')">/</button>

    <button type="button" class="key-btn key-action" onclick="pressKey('BACKSPACE')">ลบ</button>
    <button type="button" class="key-btn key-action" onclick="pressKey('CLEAR')">ล้าง</button>
    <button type="button" class="key-btn key-equals key-math" style="grid-column: span 2;" onclick="pressKey('=')">=</button>
    
    <button type="button" class="key-btn key-close" style="grid-column: span 4;" onclick="closeKeypad()">ตกลง / ยืนยัน</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
  const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
  
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
    "Prefer": "return=representation"
  };

  let globalData = { orders: [], employees: [], targets: [], reasons: [], workItems: [], steps: [], orderSteps: [], shortcutMap: [] };
  let activeInputId = null;
  let isEditMode = false;
  let originalRecordKey = null;
  let html5QrCode = null;

  window.onload = async function() {
    // ---------------------------------------------------------
    // ตั้งค่า วันที่เริ่มต้น ให้เป็น "เมื่อวาน" อัตโนมัติ 
    // ---------------------------------------------------------
    let yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    document.getElementById('record_date').value = yesterday.toISOString().split('T')[0];
    
    const urlParams = new URLSearchParams(window.location.search);
    const scannedOrderId = urlParams.get('order_id');
    const scannedTargetId = urlParams.get('target_id');

    try {
      const [ordersRes, empsRes, targetsRes, reasonsRes, workItemsRes, stepsRes, orderStepsRes] = await Promise.all([
        fetch(SUPABASE_URL + "/orders?select=*", { headers }),
        fetch(SUPABASE_URL + "/employees?select=*", { headers }), 
        fetch(SUPABASE_URL + "/targets?select=*", { headers }), 
        fetch(SUPABASE_URL + "/reasons?select=*", { headers }),
        fetch(SUPABASE_URL + "/work_items?select=*", { headers }),
        fetch(SUPABASE_URL + "/production_steps?select=*", { headers }),
        fetch(SUPABASE_URL + "/order_steps?select=*", { headers }) 
      ]);

      if (!ordersRes.ok || !targetsRes.ok) throw new Error("Database Fetch Error");

      let ords = await ordersRes.json();
      ords.sort((a, b) => String(a.order_no || '').localeCompare(String(b.order_no || ''), 'th', { numeric: true }));
      globalData.orders = ords;
      
      let emps = await empsRes.json();
      emps.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'th'));
      globalData.employees = emps;

      let tgts = await targetsRes.json();
      tgts.sort((a, b) => (a.id_target || 0) - (b.id_target || 0));
      globalData.targets = tgts;

      let rens = await reasonsRes.json();
      rens.sort((a, b) => (a.id_reason || 0) - (b.id_reason || 0));
      globalData.reasons = rens;

      if (workItemsRes.ok) {
        let works = await workItemsRes.json();
        works.sort((a, b) => String(a.work_code || '').localeCompare(String(b.work_code || ''), 'th', { numeric: true }));
        globalData.workItems = works;
      }
      if (stepsRes.ok) {
        let stps = await stepsRes.json();
        stps.sort((a, b) => (a.id_step || 0) - (b.id_step || 0));
        globalData.steps = stps;
      }
      if (orderStepsRes.ok) {
        globalData.orderSteps = await orderStepsRes.json();
      }

      generateShortcutMap();

      populateDropdown('id_order', globalData.orders, 'id_order', 'order_no'); 
      populateDropdown('id_reason', globalData.reasons, 'id_reason', 'reason_detail');
      
      // Select Box ซ่อนสำหรับกัน JS error
      populateDropdown('filter_order', globalData.orders, 'id_order', 'order_no');
      populateDropdown('filter_work', globalData.workItems, 'id_work', 'work_code');

      const empDatalist = document.getElementById('employee_datalist');
      globalData.employees.forEach(emp => {
        let opt = document.createElement('option');
        opt.value = emp.name;
        empDatalist.appendChild(opt);
      });

      document.getElementById('statusMessage').style.display = 'none';
      document.getElementById('prodForm').style.display = 'block';
      document.getElementById('statusText').innerText = "ระบบพร้อมใช้งาน";

      if (scannedOrderId) {
        const foundOrd = globalData.orders.find(o => String(o.id_order) === String(scannedOrderId));
        if (foundOrd) {
          document.getElementById('id_order').value = foundOrd.id_order;
          handleOrderChange();
          
          if (scannedTargetId) {
            setTimeout(() => {
              document.getElementById('id_target').value = scannedTargetId;
              calculateEfficiency();
            }, 200);
          }
        }
        const lastEmployeeId = localStorage.getItem('last_employee_id');
        if (lastEmployeeId) {
          const emp = globalData.employees.find(e => String(e.id_name) === String(lastEmployeeId));
          if (emp) document.getElementById('employee_search').value = emp.name;
        }

      } else {
        loadLastSessionData();
      }

    } catch (error) {
      console.error(error);
      const msgEl = document.getElementById('statusMessage');
      msgEl.innerText = "> ระบบขัดข้อง: " + error.message;
      msgEl.className = "system-msg error";
      document.getElementById('statusDot').style.backgroundColor = "var(--neon-red)";
      document.getElementById('statusText').innerText = "ออฟไลน์";
    }
  };

  function generateShortcutMap() {
    globalData.shortcutMap = [];
    let counter = 1;
    let sortedOrders = [...globalData.orders].sort((a,b) => parseInt(a.id_order) - parseInt(b.id_order));
    
    sortedOrders.forEach(order => {
      if (order.id_work) {
        let orderTargets = globalData.targets.filter(t => String(t.id_work) === String(order.id_work));
        orderTargets.sort((a,b) => parseInt(a.id_target) - parseInt(b.id_target));
        
        orderTargets.forEach(target => {
          globalData.shortcutMap.push({
            code: String(counter).padStart(4, '0'), 
            id_order: order.id_order,
            id_target: target.id_target
          });
          counter++;
        });
      }
    });
  }

  function handleManualOrderInput(inputEl) {
    let val = inputEl.value.trim();
    if (val.length === 4) {
      const foundShortcut = globalData.shortcutMap.find(s => s.code === val);
      if (foundShortcut) {
        document.getElementById('id_order').value = foundShortcut.id_order;
        handleOrderChange();
        setTimeout(() => {
          document.getElementById('id_target').value = foundShortcut.id_target;
          calculateEfficiency();
        }, 150);
      } else {
        const foundOrd = globalData.orders.find(o => String(o.order_no || '').endsWith(val));
        if (foundOrd) {
          document.getElementById('id_order').value = foundOrd.id_order;
          handleOrderChange();
        }
      }
    } else if (val === "") {
      document.getElementById('id_order').value = "";
      handleOrderChange();
    }
  }

  function openScanner() {
    document.getElementById('scannerModal').style.display = 'flex';
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }
    
    html5QrCode.start(
      { facingMode: "environment" }, 
      { fps: 10, qrbox: { width: 250, height: 250 } },
      (decodedText) => {
        handleScannedResult(decodedText);
        closeScanner();
      },
      (errorMessage) => {}
    ).catch(err => {
      alert("ไม่สามารถเปิดกล้องได้: " + err);
      closeScanner();
    });
  }

  function closeScanner() {
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(() => {
        document.getElementById('scannerModal').style.display = 'none';
      }).catch(err => {
        document.getElementById('scannerModal').style.display = 'none';
      });
    } else {
      document.getElementById('scannerModal').style.display = 'none';
    }
  }

  function handleScannedResult(scannedText) {
    try {
      if (scannedText.includes('http://') || scannedText.includes('https://')) {
        let url = new URL(scannedText);
        let orderId = url.searchParams.get('order_id');
        let targetId = url.searchParams.get('target_id');

        if (orderId) {
          const foundOrd = globalData.orders.find(o => String(o.id_order) === String(orderId));
          if (foundOrd) {
            document.getElementById('id_order').value = foundOrd.id_order;
            handleOrderChange();
            if (targetId) {
              setTimeout(() => {
                document.getElementById('id_target').value = targetId;
                calculateEfficiency();
              }, 200);
            }
            alert("✅ สแกนสำเร็จ: โหลดข้อมูลเรียบร้อย");
            return;
          }
        }
      }
      alert("⚠️ รูปแบบคิวอาร์โค้ดไม่ถูกต้อง");
    } catch (e) {
      alert("⚠️ เกิดข้อผิดพลาดในการอ่านข้อมูลคิวอาร์โค้ด");
    }
  }

  function populateDropdown(elementId, dataArray, valueKey, textKey) {
    const select = document.getElementById(elementId);
    if (!Array.isArray(dataArray) || !select) return;
    dataArray.forEach(item => {
      let opt = document.createElement('option');
      opt.value = item[valueKey];
      opt.textContent = item[textKey] || `ID: ${item[valueKey]}`;
      select.appendChild(opt);
    });
  }

  function handleOrderChange() {
    const selectedOrderId = document.getElementById('id_order').value;
    const targetSelect = document.getElementById('id_target');
    const workHidden = document.getElementById('id_work');
    const manualInput = document.getElementById('manual_order_code');

    targetSelect.innerHTML = '<option value="">👉 กรุณาเลือกขั้นตอนทำงาน</option>';
    workHidden.value = '';
    
    if (document.activeElement.id === 'id_order') {
        manualInput.value = ''; 
    }
    
    document.getElementById('effDisplay').innerText = "0.00%";
    document.getElementById('effDisplay').style.color = "var(--text-muted)";
    document.getElementById('reasonGroup').style.display = 'none';
    document.getElementById('id_reason').value = '';
    document.getElementById('id_reason').removeAttribute('required');

    if (!selectedOrderId) { return; }

    const selectedOrder = globalData.orders.find(o => String(o.id_order) === String(selectedOrderId));
    if (!selectedOrder || !selectedOrder.id_work) {
        targetSelect.innerHTML = '<option value="">-- ไม่พบการตั้งค่าชิ้นงาน --</option>';
        return;
    }

    const currentWorkId = selectedOrder.id_work;
    workHidden.value = currentWorkId; 

    const filteredTargets = globalData.targets.filter(t => String(t.id_work) === String(currentWorkId));
    
    if (filteredTargets.length > 0) {
      filteredTargets.forEach(t => {
        let opt = document.createElement('option');
        opt.value = t.id_target; 
        
        let workDisplay = `ชิ้นงาน:${t.id_work}`;
        if (globalData.workItems.length > 0) {
          const foundWork = globalData.workItems.find(w => String(w.id_work) === String(t.id_work));
          if (foundWork) workDisplay = foundWork.work_code; 
        }

        let stepDisplay = `ขั้นตอน:${t.id_step}`;
        if (t.id_step && globalData.steps.length > 0) {
          const foundStep = globalData.steps.find(s => String(s.id_step) === String(t.id_step));
          if (foundStep) stepDisplay = foundStep.step_name;
        }

        let tgtDisplay = t.target_amount ? `${t.target_amount}/ชม.` : '';
        opt.textContent = `${workDisplay} | ${stepDisplay} ${tgtDisplay ? '| เป้า: ' + tgtDisplay : ''}`.trim();
        targetSelect.appendChild(opt);
      });
    } else {
      targetSelect.innerHTML = '<option value="">-- ไม่พบเป้าหมาย --</option>';
    }
  }

  function calculateEfficiency() {
    const ordId = document.getElementById('id_order').value;
    const targetId = document.getElementById('id_target').value;

    if (ordId && targetId) {
      const shortcutObj = globalData.shortcutMap.find(s => String(s.id_order) === String(ordId) && String(s.id_target) === String(targetId));
      if (shortcutObj) {
         document.getElementById('manual_order_code').value = shortcutObj.code;
      }
    }

    const hourWork = parseFloat(document.getElementById('hour_work').value) || 0;
    const producedAmt = parseFloat(document.getElementById('produced_amount').value) || 0;
    
    const effDisplayEl = document.getElementById('effDisplay');
    const reasonGroup = document.getElementById('reasonGroup');
    const reasonSelect = document.getElementById('id_reason');

    if (!targetId || hourWork <= 0) {
      effDisplayEl.innerText = "0.00%";
      effDisplayEl.style.color = "var(--text-muted)";
      reasonGroup.style.display = 'none';
      reasonSelect.removeAttribute('required');
      return;
    }

    const targetObj = globalData.targets.find(t => String(t.id_target) === String(targetId));
    if (!targetObj || !targetObj.target_amount) {
      effDisplayEl.innerText = "N/A";
      return;
    }

    const totalTarget = targetObj.target_amount * hourWork;
    const efficiency = totalTarget > 0 ? (producedAmt / totalTarget) * 100 : 0;

    effDisplayEl.innerText = efficiency.toFixed(2) + "%";

    if (efficiency >= 100) {
      effDisplayEl.style.color = "var(--neon-green)";
      reasonGroup.style.display = 'none';
      reasonSelect.value = '';
      reasonSelect.removeAttribute('required');
    } else {
      effDisplayEl.style.color = "var(--neon-red)";
      reasonGroup.style.display = 'block';
      reasonSelect.setAttribute('required', 'true');
    }
  }

  function loadLastSessionData() {
    const lastOrderId = localStorage.getItem('last_order_id');
    const lastTargetId = localStorage.getItem('last_target_id');
    const lastEmployeeId = localStorage.getItem('last_employee_id');

    if (lastOrderId) {
      document.getElementById('id_order').value = lastOrderId;
      handleOrderChange();
      if (lastTargetId) {
        document.getElementById('id_target').value = lastTargetId;
        calculateEfficiency(); 
      }
    }
    
    if (lastEmployeeId) {
      const emp = globalData.employees.find(e => String(e.id_name) === String(lastEmployeeId));
      if (emp) {
        document.getElementById('employee_search').value = emp.name;
      }
    }
  }

  function cancelEditMode() {
    isEditMode = false;
    originalRecordKey = null;
    document.getElementById('prodForm').reset();
    
    let yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    document.getElementById('record_date').value = yesterday.toISOString().split('T')[0];
    
    document.getElementById('id_target').innerHTML = '<option value="">👉 รอเลือกรหัสใบสั่งงานก่อน</option>';
    document.getElementById('id_work').value = '';
    document.getElementById('employee_search').value = ''; 
    document.getElementById('submitBtn').innerText = "บันทึกข้อมูล";
    document.getElementById('cancelEditBtn').style.display = 'none';
    document.getElementById('reasonGroup').style.display = 'none';
    document.getElementById('effDisplay').innerText = "0.00%";
    document.getElementById('effDisplay').style.color = "var(--text-muted)";
  }

  // -------------------------------------------------------------
  // โค้ดปรับแก้ส่วนที่แป้นพิมพ์เด้งบังหน้าจอ
  // -------------------------------------------------------------
  function openKeypad(inputId) {
    activeInputId = inputId;
    let labelText = document.querySelector(`label[for="${inputId}"]`);
    let title = labelText ? labelText.innerText : "";
    
    if (inputId === 'hour_work') title = 'ชั่วโมงทำงาน';
    else if (inputId === 'produced_amount') title = 'จำนวนผลิต';
    else if (inputId === 'manual_order_code') title = 'รหัสใบสั่งงาน';

    document.getElementById('keypadTitle').innerText = "> พิมพ์ค่า: " + title;

    let isCode = (inputId === 'manual_order_code');
    document.querySelectorAll('.key-math').forEach(btn => {
      btn.style.visibility = isCode ? 'hidden' : 'visible'; 
    });

    document.getElementById('numericKeypad').style.display = 'block';

    // เพิ่มพื้นที่ด้านล่างหลอกๆ 450px เพื่อให้หน้าจอมีระยะเลื่อนลงไปได้อีก
    document.body.style.paddingBottom = "450px";

    // สั่งดันช่องที่กำลังกรอก ขึ้นไปอยู่ "บนสุด" ของหน้าจอ
    setTimeout(() => {
      document.getElementById(inputId).scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 150);
  }

  function closeKeypad() {
    if (activeInputId && activeInputId !== 'manual_order_code') {
      let input = document.getElementById(activeInputId);
      input.value = calculateMath(input.value);
    }
    document.getElementById('numericKeypad').style.display = 'none';
    activeInputId = null;
    
    // หดพื้นที่ด้านล่างกลับเป็นปกติเมื่อปิดแป้นพิมพ์
    document.body.style.paddingBottom = "10px";
    
    calculateEfficiency();
  }
  // -------------------------------------------------------------

  function calculateMath(expression) {
    try {
      if(!expression) return '';
      let result = Function('"use strict";return (' + expression + ')')();
      if(isNaN(result) || !isFinite(result)) return expression;
      return Number.isInteger(result) ? result : parseFloat(result.toFixed(4));
    } catch(e) {
      return expression; 
    }
  }

  function pressKey(val) {
    if (!activeInputId) return;
    let input = document.getElementById(activeInputId);
    let currentVal = input.value;

    if (val === 'CLEAR') {
      input.value = '';
    } else if (val === 'BACKSPACE') {
      input.value = currentVal.slice(0, -1);
    } else if (val === '=') {
      input.value = calculateMath(currentVal);
    } else {
      if (activeInputId === 'manual_order_code') {
        if (['+', '-', '*', '/', '=', '.'].includes(val)) return;
        if (currentVal.length + val.length > 4) {
          val = val.slice(0, 4 - currentVal.length);
        }
      }
      input.value = currentVal + val;
    }

    if (activeInputId === 'manual_order_code') {
      handleManualOrderInput(input);
    } else {
      calculateEfficiency();
    }
  }

  async function handleSubmit(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = isEditMode ? "กำลังอัปเดต..." : "กำลังบันทึก...";

    const orderVal = document.getElementById('id_order').value;
    const targetVal = document.getElementById('id_target').value;
    const empSearchVal = document.getElementById('employee_search').value;
    const empObj = globalData.employees.find(e => e.name === empSearchVal);
    const employeeVal = empObj ? empObj.id_name : null;

    if (!employeeVal) {
      alert("⚠️ กรุณาระบุชื่อพนักงานให้ถูกต้อง (เลือกจากรายการที่ค้นหา)");
      submitBtn.disabled = false;
      submitBtn.innerText = isEditMode ? "อัปเดตข้อมูล" : "บันทึกข้อมูล";
      return;
    }

    const payload = {
      record_date: document.getElementById('record_date').value,
      id_order: parseInt(orderVal) || null,
      id_work: parseInt(document.getElementById('id_work').value) || null,
      id_name: parseInt(employeeVal) || null,
      id_target: parseInt(targetVal) || null,
      hour_work: parseFloat(document.getElementById('hour_work').value) || 0,
      produced_amount: parseInt(document.getElementById('produced_amount').value) || 0,
      id_reason: parseInt(document.getElementById('id_reason').value) || null
    };

    try {
      let response;
      if (isEditMode) {
        const queryStr = `record_date=eq.${originalRecordKey.record_date}&id_order=eq.${originalRecordKey.id_order}&id_target=eq.${originalRecordKey.id_target}&id_name=eq.${originalRecordKey.id_name}`;
        response = await fetch(`${SUPABASE_URL}/daily_production?${queryStr}`, {
          method: "PATCH",
          headers: headers,
          body: JSON.stringify(payload)
        });
      } else {
        response = await fetch(`${SUPABASE_URL}/daily_production`, {
          method: "POST",
          headers: headers,
          body: JSON.stringify(payload)
        });
      }

      if (response.ok) {
        alert("✅ บันทึกข้อมูลเรียบร้อยแล้ว!");

        localStorage.setItem('last_order_id', orderVal);
        localStorage.setItem('last_target_id', targetVal);
        localStorage.setItem('last_employee_id', employeeVal);

        if (isEditMode) {
          cancelEditMode();
        } else {
          document.getElementById('produced_amount').value = '';
          document.getElementById('id_reason').value = '';
          document.getElementById('reasonGroup').style.display = 'none';
          document.getElementById('effDisplay').innerText = "0.00%";
          document.getElementById('effDisplay').style.color = "var(--text-muted)";
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

      } else {
        const errData = await response.json();
        alert("❌ บันทึกข้อมูลล้มเหลว: " + (errData.message || JSON.stringify(errData)));
      }
    } catch (error) {
      console.error(error);
      alert("⚠️ ข้อผิดพลาดในการเชื่อมต่อ: " + error.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "บันทึกข้อมูล";
    }
  }
</script>
